<!DOCTYPE html>
<html>
    <style>
        body {
            font-family: Calibri, sans-serif;
        }

        p, ol, ul {
            margin-block-start: 0;
            margin-block-end: 0;
        }
    </style>
    <link rel="icon" type="image/x-icon" href="./puzzleMind32.png">
    <link href="docxConvert.css" rel="stylesheet">
<script src="docshift.min.js"></script>
<script src="pipeKeys.js"></script>
<script>var db = {}</script>
<script id="dbScript" src="docxConvert_DB_2.js"></script>
<script id="mainScript" src="docxConvert.js"></script>
<body>
<div class="page-cover hidden">
    <div class="overlay">
        <div class="control"><span id="closeBtn" class="btn-close"><svg focusable="false" viewBox="0 0 52 52" part="icon"><g><path d="M31 25.4l13-13.1c.6-.6.6-1.5 0-2.1l-2-2.1c-.6-.6-1.5-.6-2.1 0L26.8 21.2c-.4.4-1 .4-1.4 0L12.3 8c-.6-.6-1.5-.6-2.1 0l-2.1 2.1c-.6.6-.6 1.5 0 2.1l13.1 13.1c.4.4.4 1 0 1.4L8 39.9c-.6.6-.6 1.5 0 2.1l2.1 2.1c.6.6 1.5.6 2.1 0L25.3 31c.4-.4 1-.4 1.4 0l13.1 13.1c.6.6 1.5.6 2.1 0L44 42c.6-.6.6-1.5 0-2.1L31 26.8c-.4-.4-.4-1 0-1.4z"></path></g></svg></span></div>
        <div class="message"></div>
        <div class="control"></div>
    </div>
</div>
<div class="app-container">
    <header class="top-bar">
        <div id="btnBanner">
            <button id="loadData">DEMO</button>
            <input class="hidden" type="file" id="docpicker" accept=".doc,.docx,.xml,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
            <button id="loadBtn">Load</button><button id="submitBtn">Convert</button><button id="saveBtn">Save</button>
        </div>
        <div class="info-banner">
            <div style="margin-left: 25px; width: 540px;"><strong>Doc Loaded:</strong> <span id="loadedDoc"></span></div>
            <div style="margin-left: 25px;"><strong>Save As:</strong> <span id="saveName"></span></div>
        </div>
    </header>
    <main class="main-view">
    <div class="layout-container">
        <section class="chkbx-form panel left-panel">
            <br>
            <table>
                <tbody id="fields">
                    <tr><td>Portfolio</td><td><input id="pfNumFld" data-input="Portfolio Number" placeholder="Portfolio Number"></td></tr>
                    <tr><td>Case</td><td><input id="caseNameNum" data-input="Case Name and Number" placeholder="Case Name and Number"></td></tr>
                    <tr><td>Formatted Summary</td><td><textarea id="summ" data-input="Formatted Summary"></textarea></td></tr>
                    <tr><td>Tax Authority</td><td><input id="taxAuth" data-input="Tax Authority" placeholder="Tax Authority"></td></tr>
                    <tr><td>Tax Year</td><td><input id="taxYear" data-input="Tax Year" placeholder="Tax Year"></td></tr>
                    <tr><td>Tax Form</td><td><input id="taxForm" data-input="Tax Form" placeholder="Tax Form"></td></tr>
                    <tr><td>Notice Number</td><td><input id="noticeNumber" data-input="Notice Number" placeholder="Notice Number"></td></tr>
                    <tr><td>Notice Type</td><td><input id="noticeType" data-input="Notice Type" placeholder="Notice Type"></td></tr>
                    <tr><td>Notice Date</td><td><input id="noticeDate" data-input="Notice Date" placeholder="Notice Date"></td></tr>
                    <tr><td>Name Merge</td><td><input id="nameMerge" data-input="Name Merge" placeholder="Name Merge"></td></tr>
                    <tr><td>Primary Name</td><td><input id="primName" data-input="Primary Name" placeholder="Primary Name"></td></tr>
                    <tr><td>Secondary Name</td><td><input id="secName" data-input="Secondary Name" placeholder="Secondary Name"></td></tr>
                </tbody>
            </table>
            <div class="form-wrapper">
                <form id="perspective">
                    <fieldset>
                        <legend>Summary: Writing Perspective</legend>
                        <div>
                            <label for="first">
                                <input type="radio" id="first" name="q1" value="First Person">
                                First Person
                            </label><br>
                            <label for="third">
                                <input type="radio" id="third" name="q1" value="Third Person">
                                Third Person
                            </label>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>POA Status</legend>
                        <div>
                            <label for="no_POA">
                                <input type="radio" id="no_POA" name="q2" value="No POA">
                                No POA
                            </label><br>
                            <label for="signed_POA">
                                <input type="radio" id="signed_POA" name="q2" value="Signed POA">
                                Signed POA
                            </label>
                        </div>
                    </fieldset>
                </form>
                <p id="persp_output"></p>
                <input id="poaForm" class="hidden" data-input="2848" placeholder="2848">
                <input id="repName" class="hidden" data-input="Representative" placeholder="Representative">
                <input id="desig" class="hidden" data-input="Designation" placeholder="Designation">
                <p><input id="auditRecon" type="checkbox" data-input="Audit Recon"><label for="auditRecon">Request Audit Reconsideration</label></p>
                <p><span id="docsLabel">Docs List</span></p><textarea id="docsList" data-input="Docs List" placeholder="Docs List"></textarea>
                <p>Taxing Authority Address</p><textarea id="taAddress" data-input="TA Address" placeholder="TA Address"></textarea>
                <p>Taxing Authority Fax</p><input id="taFax" data-input="TA Fax" placeholder="TA Fax">
                <p>Pre-Consult Review</p><textarea id="preConsRvw" data-input="Pre-Consult Review" placeholder="Pre-Consult Review"></textarea>
            </div>
        </section>
        <section id="output-wrapper" class="panel right-panel"><div id="output"></div></section>
    </div>
</div>
<script>
    const sureStatus = {};

    function reloadScript(scriptId) {
        const oldScript = document.getElementById(scriptId);
        if (oldScript) {
            const src = oldScript.src;
            oldScript.remove();
            const newScript = document.createElement('script');
            newScript.id = scriptId;
            newScript.src = src;
            document.head.appendChild(newScript);
            console.log(`'${src}' reloaded.`);
        }
    }

    loadData.addEventListener("click", (e) => {
        loadDemoData();
    });

    loadBtn.addEventListener("click", async (e) => {
        docpicker.click();
        waitFor(() => docpicker.files[0]).then(async (file) => {
            if (file) {
                db.htmlContent = await docshift.toHtml(file);
            }
            loadedDoc.innerText = file.name;
        })
    });
    submitBtn.addEventListener("click", async (e) => { await fileToHTML() });
    saveBtn.addEventListener("click", async (e) => { await htmlToFile("output") });
    document.addEventListener("paste", async (e) => {
        if (e.target !== caseNameNum && e.target !== pfNumFld) { return }
        navigator.clipboard.readText().then((txt) => {
            setSaveName();
        })
    })
    perspective.addEventListener("change", (e) => {
        //e.preventDefault();
        const data = new FormData(perspective);
        let arr = [...data.entries()];
        //  [['fav_language', 'JavaScript'],['age', '60']]
        let header = document.querySelector(`#output [data-template="Header"]`);
        let closing = document.querySelector(`#output [data-template="Closing"]`);
        let ans = [];
        arr.forEach((ea) => {
            ans.push(ea[1]);
        });
        let resp = "";
        if (!ans[0] || !ans[1]) { return }
        if (ans[0] === "First Person" && ans[1] === "No POA") {
            resp = `Writing Perspective Confirmed: Use client header and write as them.`;
            poaForm.classList.add("hidden");
            repName.classList.add("hidden");
            desig.classList.add("hidden");
            poaText?.classList.add("hidden");
        } else if (ans[0] === "First Person" && ans[1] === "Signed POA") {
            resp = `<span style="color: red;">Writing Perspective incorrect:</span> Should be Third Person (written from us) with signed POA.`;
            poaForm.classList.remove("hidden");
            repName.classList.remove("hidden");
            desig.classList.remove("hidden");
            poaText?.classList.remove("hidden");
        } else if (ans[0] === "Third Person" && ans[1] === "No POA") {
            resp = `Have POA, but not writing as TPP.`;
            poaForm.classList.add("hidden");
            repName.classList.add("hidden");
            desig.classList.add("hidden");
            poaText?.classList.add("hidden");
        } else if (ans[0] === "Third Person" && ans[1] === "Signed POA") {
            resp = `Writing Perspective Confirmed: Use TPP Letterhead and write as POA.`;
            poaForm.classList.remove("hidden");
            repName.classList.remove("hidden");
            desig.classList.remove("hidden");
            poaText?.classList.remove("hidden");
        }
        if (header) { header.outerHTML = db.templates["Header"]() }
        if (closing) { 
            let html = db.templates["Closing"]();
            html = loadOutputFields(html);
            html = fillValues(html,"inputs");
            closing.outerHTML = html;
        }
        document.querySelector("#persp_output").innerHTML = resp;
        let pcwField = document.querySelector("[data-input='Pre-Consult Review']");
        let list = [
            `Writing Perspective Confirmed: Use client header and write as them.`,
            `Writing Perspective incorrect: Should be Third Person (written from us) with signed POA.`,
            `Have POA, but not writing as TPP.`,
            `Writing Perspective Confirmed: Use TPP Letterhead and write as POA.`,
        ];
        let regExpList = createRegExpList(list);
        if (pcwField) {
            if (pcwField.value.match(resp)) {
                return;
            } else if (pcwField.value.match(regExpList)) {
                pcwField.value = pcwField.value.replace(regExpList,resp);
            } else { 
                pcwField.value = "- "+resp+"\n"+pcwField.value; 
            }  
        }
    })
    summ.addEventListener("keydown", (e) => { 
        if (e.key !== "Enter") { return }
        e.preventDefault();
        db.summData = getSummaryData(summ.value);
        updateFromSummary();
        setSaveName();
        updateNoticeType();
        updateOtherItems();
        fileToHTML();
    });
    /*primName.addEventListener("paste", (e) => {
        let isBusiness = caseNameNum?.value.match(/\*\d{2}-\d{7}/);
        if (isBusiness) {
            let busName = caseNameNum?.value.replace(/^([^\*]+) \*[^]+$/,"$1")
            if (!busName) { return }
            nameMerge.value = busName;
        } else if (nameMerge?.value === "") {
            navigator.clipboard.readText().then((txt) => {
                txt = fixMidInitial(txt);
                txt = fixLastNames(txt);
                primName.value = txt;
                nameMerge.value = txt;
            });
        }
    });*/
    nameMerge.addEventListener("paste", async (e) => { 
        navigator.clipboard.readText().then((txt) => {
            nameMergeHandler(txt);
            /*txt = txt.replace(/\&(amp;|)/,"and");
            txt = fixMidInitial(txt);
            txt = fixLastNames(txt);
            nameMerge.value = txt;
            if (txt.match(/ and /)) {
                let splits = txt.split(/ and /);
                primName.value = splits[0];
                secName.value = splits[1];
                let noLast = splits[0].match(/^[^ ]+ ?[A-Z]?\.?$/);
                if (noLast) {
                    let last = splits[1].split(/ /g).pop();
                    primName.value = `${splits[0]} ${last}`;
                    nameMerge.value = `${splits[0]} ${last} and ${splits[1]}`;
                }
            }*/
        });
    });
    taAddress.addEventListener("keydown", (e) => {
        if (e.key === "|" && e.shiftKey) {
            e.preventDefault();
            let txt = taAddress.value;
            txt = titleCase(txt);
            // add comma after city if not present:
            txt = txt.replace(/, (?![A-Z]{2} \d{5}(?:-\d{4}|))/g,"\n").replace(/([^, ])( [A-Z]{2} \d{5}(?:-\d{4}|))/,"$1,$2");
            txt = fixPhone(txt);
            taAddress.value = txt;
        };
    });
    taFax.addEventListener("paste", (e) => {
        navigator.clipboard.readText().then((txt) => {
            taFax.value = fixPhone(txt);
        });
    });
    taFax.addEventListener("keydown", (e) => {
        if (e.key === "|" && e.shiftKey) {
            e.preventDefault();
            let txt = taFax.value;
            taFax.value = fixPhone(txt);
        };
    });
    docsList.addEventListener("keydown", (e) => {
        if ((e.key === "|" || e.key === "~") && e.shiftKey) {
            e.preventDefault();
            let list = docsList.value;
            if (list.match(/C:\\/)) {
                list = list.matchAll(/\\([^"\\]+)"/g);
                list = [...list].map((txt) => txt[1].replace(/\.pdf *$/i,"")).join("\n");
                docsList.value = list;
                console.log("Changed paths to filenames.")
                return;
            }
            list = fixFormNames(list);
            list = fixDates(list);
            list = fixAmounts(list);
            docsList.value = list;
        } else if (e.key === "!" && e.shiftKey) {
            e.preventDefault();
            let list = docsList.value;
            if (!document.getElementById("docsWarn")) {
                list = list.matchAll(/^(.+?)$/gm);
                db.oldDocList = [...list].map((txt) => txt[1]);
                list = db.oldDocList.join("\n");
                docsList.value = list;
                // add elem after label to indicate name change is in process
                // ex: "Edit names"
                let span = document.createElement("SPAN");
                span.id = "docsWarn";
                span.innerText = ` - Change names:`;
                docsLabel.after(span);
            } else if (docsWarn?.innerText.match(/Change names/)) {
                // filenames assumed to be edits
                // cmd code will be built
                list = list.matchAll(/^([^\n]+?)$/gm);
                list = [...list].map((txt) => `"${txt[1]}"`);
                let originals = db.oldDocList.map((txt) => `"${txt.trim()}"`).join(",");
                let renames = list.join(",");
                docsList.value = `${originals};${renames}`;
                docsWarn.remove();
                db.oldDocList = [];
            }
        }
    })
    document.addEventListener("keydown", (e) => {
        if (e.key === "|" && e.shiftKey) {
            if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.getAttribute("contenteditable")) {
                return;
            }
            e.preventDefault();
            db.summData = getSummaryData(summ.value);
            updateFromSummary();
            setSaveName();
            updateNoticeType();
            updateOtherItems();
            fileToHTML();
        }
    })
    document.addEventListener("paste", (e) => {
        if (e.target.tagName !== "INPUT" && e.target.tagName !== "TEXTAREA") { return }
        navigator.clipboard.readText().then((txt) => {
            if (txt.match(/(^\s|\s$)/)) {
                txt = txt.trim();
                e.target.value = txt;
            }
        });
    })
    
    setDefaultValues();
</script>
</body>
</html>
